# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: my-efs-sc
# provisioner: efs.csi.aws.com
# parameters:
#   provisioningMode: efs-ap
#   fileSystemId: fs-078df6759741c5dee
#   directoryPerms: "700"
#   gidRangeStart: "1000"
#   gidRangeEnd: "2000"
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-078df6759741c5dee 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-efs-pvc
  namespace: 3-tier-app-eks
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: efs-pv
